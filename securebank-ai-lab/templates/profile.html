{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>My Profile</h2>
  <form method="POST">
    <label>Full name</label>
    <input name="full_name" value="{{ user.full_name }}">
    <label>Bio</label>
    <textarea name="bio" rows="3">{{ user.bio }}</textarea>
    <button type="submit">Save</button>
  </form>
</div>

<div class="card">
  <h3>Public preview</h3>
  <p><strong>{{ user.full_name }}</strong></p>
  <!-- VULN #3: in vulnerable mode safe_bio is rendered without escaping -->
  <div class="bio-preview">{{ safe_bio }}</div>
</div>
{% endblock %}
